<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Salary Prediction</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; background: #f7f7f7; }
        .card { background: white; padding: 28px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px; }
        button { margin-top: 20px; padding: 12px 18px; border: 0; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Employee Salary Prediction Form</h1>
        <form action="/predict" method="post">
            <label for="years_experience">Years of Experience:</label>
            <input type="number" step="0.1" id="years_experience" name="years_experience" value="5" required>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" value="30" required>

            <label for="department">Department:</label>
            <select id="department" name="department" required>
                <option value="IT">IT</option>
                <option value="HR">HR</option>
                <option value="Finance">Finance</option>
                <option value="Marketing">Marketing</option>
                <option value="Sales">Sales</option>
                <option value="Operations">Operations</option>
            </select>

            <label for="education_level">Education Level:</label>
            <select id="education_level" name="education_level" required>
                <option value="Bachelor">Bachelor</option>
                <option value="Master">Master</option>
                <option value="PhD">PhD</option>
            </select>

            <label for="job_role">Job Role:</label>
            <select id="job_role" name="job_role" required>
                <option value="Junior">Junior</option>
                <option value="Mid">Mid</option>
                <option value="Senior">Senior</option>
                <option value="Manager">Manager</option>
                <option value="Director">Director</option>
            </select>

            <label for="performance_score">Performance Score:</label>
            <input type="number" step="0.1" min="1" max="5" id="performance_score" name="performance_score" value="4.2" required>

            <button type="submit">Predict Salary</button>
        </form>
    </div>
</body>
</html>
