<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
</head>
<body>
    <h1>Prediction Result</h1>

    {% if prediction %}
        <p>{{ prediction }}</p>
    {% else %}
        <p>Error: No prediction received.</p>
    {% endif %}

    <a href="/">Go back</a>
</body>
</html>
